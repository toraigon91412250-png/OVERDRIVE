<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js"></script>
<script>
// Wall Maria is registered before the scene is initialized.
/*
 * WALL MARIA • Low-poly modular model for THREE.js (r147+)
 * No asset downloads, no textures required beyond procedural CanvasTexture.
 * API: const wall = WallMaria.create(THREE, {bayCount: 14, bayWidth: 26, quality: 'standard'});
 * scene.add(wall.group); wall.setGateOpen(true); wall.update(delta);
 * wall.getColliders() gives AABB obstacles (meters) for game collision.
 */
(function (root) {
  'use strict';
  const cache = new WeakMap();

  function seeded(seed) { let n = seed >>> 0; return () => ((n = (1664525 * n + 1013904223) >>> 0) / 4294967296); }
  function stoneTexture(THREE) {
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const c = canvas.getContext('2d');
    const r = seeded(5041);
    c.fillStyle = '#aab0ac'; c.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 1150; i++) {
      const k = Math.floor(130 + r() * 65);
      c.fillStyle = `rgba(${k},${k+3},${k},${0.025 + r() * .055})`;
      c.fillRect(r()*512, r()*512, 4+r()*65, 2+r()*55);
    }
    const rows = 20, rh = 512 / rows;
    for (let row = 0; row < rows; row++) {
      const y = row*rh, offset = row % 2 ? 27 : 0;
      c.strokeStyle = 'rgba(54,62,61,.32)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(0, y); c.lineTo(512, y); c.stroke();
      for(let x = -offset; x < 515; x += 51.2){
        const jitter = (r()-.5)*5;
        c.beginPath(); c.moveTo(x+jitter, y); c.lineTo(x+jitter+r()*2, y+rh); c.stroke();
        c.fillStyle = `rgba(221,223,213,${.035+r()*.085})`;
        c.fillRect(x+3, y+3, 36+r()*9, rh-6);
      }
    }
    for(let i=0;i<40;i++){
      const x=r()*512, y=r()*512; const gr=c.createRadialGradient(x,y,1,x,y,10+r()*47);
      gr.addColorStop(0, 'rgba(63,77,67,.11)'); gr.addColorStop(1,'rgba(63,77,67,0)');
      c.fillStyle=gr;c.fillRect(x-65,y-65,130,130);
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.colorSpace = THREE.SRGBColorSpace || undefined;
    if('encoding' in tex) tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 2;
    return tex;
  }

  function mat(THREE, color, extra={}) {
    return new THREE.MeshLambertMaterial({ color, ...extra });
  }
  function cube(THREE, parent, w,h,d, x,y,z, material){
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material);
    m.position.set(x,y,z); parent.add(m); return m;
  }
  function beam(THREE,parent,a,b,thickness,material){
    const start = new THREE.Vector3(...a), end = new THREE.Vector3(...b);
    const dir = end.clone().sub(start);
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(thickness,dir.length(),thickness),material);
    mesh.position.copy(start.add(end).multiplyScalar(.5));
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
    parent.add(mesh); return mesh;
  }
  function instanced(THREE, parent, geometry, material, placements) {
    if (!placements.length) return null;
    const mesh = new THREE.InstancedMesh(geometry, material, placements.length);
    const dummy = new THREE.Object3D();
    for (let i=0; i<placements.length; i++) {
      const p=placements[i];
      dummy.position.set(p[0],p[1],p[2]);
      dummy.rotation.set(0,p[3]||0,0);
      dummy.scale.set(p[4]||1,p[5]||1,p[6]||1);
      dummy.updateMatrix(); mesh.setMatrixAt(i,dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.frustumCulled = false;
    parent.add(mesh); return mesh;
  }
  function buttressGeometry(THREE) {
    const pts = [
      [-3.0,0,0], [3.0,0,0], [-1.8,48.6,0], [1.8,48.6,0],
      [-3.15,0,3.55], [3.15,0,3.55], [-2.0,48.6,2.0], [2.0,48.6,2.0]
    ];
    const indices=[0,1,3, 0,3,2, 5,4,6, 5,6,7, 4,0,2,4,2,6, 1,5,7,1,7,3, 2,3,7,2,7,6, 4,5,1,4,1,0];
    const pos=[], col=[];
    for (let i=0;i<indices.length;i++){
      const idx=indices[i];pos.push(...pts[idx]);
      const light = idx >=4 ? .84 : 1.0;
      col.push(light,light*.998,light*.98);
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
    g.computeVertexNormals(); return g;
  }
  function createGateDoor(THREE, parent, left, materials) {
    const leafW = 6.0, shape = new THREE.Shape();
    if(left){
      shape.moveTo(0,.25); shape.lineTo(leafW,.25); shape.lineTo(leafW,16.45);
      shape.quadraticCurveTo(2.7,16.35,0,12.15); shape.lineTo(0,.25);
    } else {
      shape.moveTo(-leafW,.25); shape.lineTo(0,.25); shape.lineTo(0,12.15);
      shape.quadraticCurveTo(-2.7,16.35,-leafW,16.45);
      shape.lineTo(-leafW,.25);
    }
    const pivot = new THREE.Group();
    pivot.position.set(left?-6:6,0,7.9);
    parent.add(pivot);
    const geo = new THREE.ExtrudeGeometry(shape, {depth:.75, bevelEnabled:false, curveSegments:8});
    geo.translate(0,0,-.38);
    const wood = new THREE.Mesh(geo, materials.wood); pivot.add(wood);
    // Wooden slats, bands and studs remain cheap and move with the two leaves.
    const s = left ? 1 : -1;
    for(let j=0;j<5;j++) {
      const x = s*(.62 + j*1.14);
      cube(THREE,pivot,.075,11.7,.08,x,6.2,.43,materials.woodDark);
    }
    for(const y of [2.6,7.5,11.2]){
      cube(THREE,pivot,5.93,.42,.2,s*3.0,y,.50,materials.iron);
      for(let i=0;i<5;i++) cube(THREE,pivot,.22,.22,.13,s*(.65+i*1.13),y,.64,materials.ironBright);
    }
    beam(THREE,pivot,[s*.75,1.7,.55],[s*5.3,10.7,.55],.23,materials.iron);
    cube(THREE,pivot,.75,1.3,.35,s*.55,7.3,.69,materials.ironBright);
    return pivot;
  }
  function makeLabel(THREE, group) {
    const can=document.createElement('canvas'); can.width=512; can.height=128;
    const ctx=can.getContext('2d');
    ctx.fillStyle='#293431';ctx.fillRect(0,0,512,128);
    ctx.fillStyle='#d6c4a0';ctx.fillRect(14,12,484,3);ctx.fillRect(14,113,484,3);
    ctx.font='bold 53px Georgia, serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('WALL  MARIA',256,70);
    const tx=new THREE.CanvasTexture(can);
    tx.colorSpace=THREE.SRGBColorSpace||undefined;
    if('encoding' in tx) tx.encoding=THREE.sRGBEncoding;
    const plaque = new THREE.Mesh(new THREE.PlaneGeometry(15.5,3.85),new THREE.MeshBasicMaterial({map:tx,side:THREE.DoubleSide}));
    plaque.position.set(0,37.7,8.35);group.add(plaque);
    const plaqueBack=plaque.clone();plaqueBack.rotation.y=Math.PI;plaqueBack.position.z=-8.35;group.add(plaqueBack);
  }

  function create(THREE, options={}) {
    if(!THREE || !THREE.Group) throw new Error('Pass the THREE namespace into WallMaria.create(THREE).');
    const bayCount=Math.max(3,Math.min(40,Math.floor(options.bayCount ?? 14)));
    const bayWidth=Math.max(16,Math.min(38,options.bayWidth ?? 26));
    const detail=options.quality !== 'lite';
    const hasGate=options.gate !== false;
    const halfGate=14, wallHeight=50, thickness=14;
    const halfLength=halfGate+bayWidth*bayCount;
    const group = new THREE.Group();group.name='WallMaria_LowPoly';
    const tex=stoneTexture(THREE);
    const wallMat = mat(THREE,0xd6d9d3,{map:tex});
    const baseMat=mat(THREE,0x98a19c);
    const pillarMat=mat(THREE,0xc3c7bd,{vertexColors:true,side:THREE.DoubleSide});
    const ash=mat(THREE,0x9da8a1);
    const ledge=mat(THREE,0xb4bcb4);
    const ledgeDark=mat(THREE,0x7b8883);
    const stoneAccent=mat(THREE,0xe0ddcf);
    const wood=mat(THREE,0x5b3e30), woodDark=mat(THREE,0x443127);
    const iron=mat(THREE,0x2f373a), ironBright=mat(THREE,0x8e9691);
    const materials={wood,woodDark,iron,ironBright};
    const bodyGeo=new THREE.BoxGeometry(bayWidth+.05,48.6,thickness);
    const bodyCenters=[];
    const buttressPositions=[], feetPositions=[], capPositions=[], topMarkPositions=[], merlonPositions=[];
    for(const side of [-1,1]){
      for(let i=0;i<bayCount;i++){
        const x=side*(halfGate+bayWidth*(i+.5));
        bodyCenters.push([x,24.3,0]);
      }
      for(let i=0;i<=bayCount;i++){
        const x=side*(halfGate+bayWidth*i);
        // Two buttresses on outer and inner face. Front face projects toward z+.
        buttressPositions.push([x,0,7],[x,0,-7,Math.PI]);
        feetPositions.push([x,.82,0]);
        capPositions.push([x,49.0,0]);
        topMarkPositions.push([x,51.35,0]);
      }
      cube(THREE,group,bayCount*bayWidth,2.0,16,side*(halfGate+bayCount*bayWidth/2),49.5,0,ledge);
      cube(THREE,group,bayCount*bayWidth,.7,17,side*(halfGate+bayCount*bayWidth/2),47.9,0,ledgeDark);
      for(let i=0;i<bayCount*3;i++){
        const x=side*(halfGate+(i+.5)*bayWidth/3);
        for(const z of [-7.4,7.4]) merlonPositions.push([x,51.55,z]);
      }
    }
    instanced(THREE,group,bodyGeo,wallMat,bodyCenters);
    instanced(THREE,group,buttressGeometry(THREE),pillarMat,buttressPositions);
    instanced(THREE,group,new THREE.BoxGeometry(6.9,1.65,21),baseMat,feetPositions);
    instanced(THREE,group,new THREE.BoxGeometry(5.15,2.45,18.5),ash,capPositions);
    instanced(THREE,group,new THREE.BoxGeometry(5.8,1.02,19.4),stoneAccent,topMarkPositions);
    instanced(THREE,group,new THREE.BoxGeometry(4.4,2.0,1.55),ash,merlonPositions);
    // Low-detail mortar ribs suggest huge individual wall panels.
    if(detail){
      const rib=[];
      for(const side of [-1,1])for(let i=0;i<bayCount;i++){
        const x=side*(halfGate+bayWidth*(i+.5));
        for(const z of [-7.045,7.045]) {
          for(const y of [13,26,39]) rib.push([x,y,z]);
        }
      }
      instanced(THREE,group,new THREE.BoxGeometry(bayWidth-.8,.15,.065),ledgeDark,rib);
    }
    const gateDetails=new THREE.Group();group.add(gateDetails);
    // Gate is a *real hole*: main wall sections don't extend into the passage.
    const arch=new THREE.Shape();
    arch.moveTo(-halfGate,0);arch.lineTo(halfGate,0);arch.lineTo(halfGate,21);
    arch.lineTo(-halfGate,21);arch.lineTo(-halfGate,0);
    const hole=new THREE.Path();
    hole.moveTo(-6.05,-.5);hole.lineTo(6.05,-.5);hole.lineTo(6.05,12.15);
    hole.quadraticCurveTo(0,20.8,-6.05,12.15);hole.lineTo(-6.05,-.5);
    arch.holes.push(hole);
    const gateArch=new THREE.Mesh(new THREE.ExtrudeGeometry(arch,{depth:thickness,bevelEnabled:false,curveSegments:12}),baseMat);
    gateArch.position.z=-thickness/2;gateDetails.add(gateArch);
    cube(THREE,gateDetails,28,26.6,14,0,34.3,0,wallMat);
    cube(THREE,gateDetails,31,2,18,0,48.5,0,ledge);
    cube(THREE,gateDetails,31.8,.75,19,0,47.2,0,ledgeDark);
    for(const x of [-12.8,12.8]){
      cube(THREE,gateDetails,6.8,51.3,17.4,x,25.65,0,baseMat);
      cube(THREE,gateDetails,8.2,2.2,20.2,x,51.2,0,stoneAccent);
      cube(THREE,gateDetails,8.6,.48,20.5,x,49.7,0,ledgeDark);
      cube(THREE,gateDetails,9.5,2.0,22,x,.95,0,ash);
    }
    // Ashlar arch outline in front and at the back of the passage.
    for(const z of [-7.45,7.45]){
      for(const x of [-6.65,6.65])cube(THREE,gateDetails,1.1,12.4,.64,x,6.2,z,stoneAccent);
      const c = new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(-6.6,12.25,z),new THREE.Vector3(0,21.45,z),new THREE.Vector3(6.6,12.25,z));
      const arc = new THREE.Mesh(new THREE.TubeGeometry(c,20,.60,5,false),stoneAccent);
      gateDetails.add(arc);
      cube(THREE,gateDetails,16.4,1.1,.78,0,20.85,z,ash);
    }
    // Repeating vertical portal insets add scale without heavy topology.
    if(detail){
      for(const z of [-8.8,8.8])for(const x of [-10.8,10.8]){
        cube(THREE,gateDetails,.45,31.0,.30,x,29.4,z,ledgeDark);
      }
      for(let j=0;j<5;j++) for(const z of [-9.05,9.05]){
        cube(THREE,gateDetails,22,.25,.19,0,25+j*4.5,z,ledge);
      }
    }
    const left=createGateDoor(THREE,gateDetails,true,materials);
    const right=createGateDoor(THREE,gateDetails,false,materials);
    let gateTarget=0, gateCurrent=0;
    // Gate doors pivot on hinges so the central passage genuinely opens.
    const leafTravel=1.42;
    function setGateOpen(open){gateTarget=open ? 1 : 0;}
    function update(dt){
      const step = Math.min(1, Math.max(0,dt)*1.65);
      gateCurrent += (gateTarget-gateCurrent)*step;
      if(Math.abs(gateTarget-gateCurrent)<.0005)gateCurrent=gateTarget;
      left.rotation.y = gateCurrent * leafTravel;
      right.rotation.y = -gateCurrent * leafTravel;

 add('stone2',cx,27,cz-19,13,55,13);add('stone4',cx,56,cz-19,15,5,15);
 for(let i=0;i<4;i++){let off=(i-1.5)*3.1;add('window',cx+off,49,cz-25.8,2,7,.3);add('beam',cx+off,49,cz-26.04,.16,7.5,.2)}
 const roof=new T.Mesh(new T.ConeGeometry(11,18,4),mat.roof1);roof.position.set(cx,68,cz-19);roof.rotation.y=Math.PI/4;city.add(roof);
 add('metal',cx,80,cz-19,.7,7,.7);add('metal',cx,82.7,cz-19,4,.6,.6);

church(49*CITY_SCALE,-44*CITY_SCALE);

add('stone1',-12,1.1,-45*CITY_SCALE,13,1.5,13);add('water',-12,2,-45*CITY_SCALE,10,.45,10);add('stone4',-12,4.8,-45*CITY_SCALE,2.2,7,2.2);add('stone2',-12,8,-45*CITY_SCALE,5,.8,5);
for(const [sx,sz] of [[-25,-25],[18,-23],[-25,-72],[20,-72]].map(([x,z])=>[x,z-45*(CITY_SCALE-1)])){
 for(let c of [-1,1]){add('wood',sx+c*3,2.3,sz,0.5,4.6,.5);add('wood',sx+c*3,2.3,sz+4,.5,4.6,.5)}

for(const market of secondMarkets){

 add('stone1',x,1.1,z,10,1.5,10);add('water',x,1.9,z,7.5,.34,7.5);add('stone4',x,4,z,1.6,5,1.6);

  const t=a*Math.PI*2/8,xs=x+Math.cos(t)*30,zs=z+Math.sin(t)*30;

// A smaller barracks watchtower at the riverbank.
for(const [tx,tz] of [[-151*CITY_SCALE,52*CITY_SCALE],[123*CITY_SCALE,-114*CITY_SCALE]]){
 add('stone0',tx,18,tz,15,36,15);add('stone4',tx,37,tz,18,3,18);
 for(let i=0;i<4;i++){const a=i*TAU/4;add('stone1',tx+7.3*Math.cos(a),41,tz+7.3*Math.sin(a),4.2,6,4.2)}
 const cone=new T.Mesh(new T.ConeGeometry(13,15,4),mat.roof2);cone.position.set(tx,50,tz);cone.rotation.y=Math.PI/4;city.add(cone);
 for(let h of [14,25])add('window',tx, h,tz+7.7,2,5,.25);

// Street furniture and sparse foliage inside the new perimeter.
for(let i=0;i<175;i++){
 const z=r(BACK+25,FRONT-25),x=pick(verticalStreets.filter(v=>v!==0).map(v=>v+(rand()<.5?-10:10)));
 if(!insideTown(x,z,24))continue;
 add('wood',x,3.25,z,.44,6.4,.44);add('metal',x,6.6,z,2.2,.6,2.2);add('stall0',x,6.3,z,1.5,1.1,1.5);
}
function tree(x,z,s=1){add('trunk',x,2.4*s,z,.9*s,4.8*s,.9*s);for(let j=0;j<3;j++){
 const radius=(4.5-j*.75)*s,height=(9-j)*s;add(pick(['foliage0','foliage1','foliage2']),x,(7.5+j*3.8)*s,z,radius,height,radius,r(0,TAU),0,'cone');
}}
for(let i=0;i<350;i++){
 let a=r(0,TAU),rr=r(R+38,R+310),x=Math.cos(a)*rr,z=Math.sin(a)*rr+C;
 if(rand()<.60)tree(x,z,r(.7,1.5));
}
for(let i=0;i<135;i++){
 let x=r(-R+35,R-35),z=r(BACK+35,FRONT-35);
 if(!clearLot(x,z,2))continue;
 if(colliders.some(c=>Math.abs(c.x-x)<c.w/2+5&&Math.abs(c.z-z)<c.d/2+5))continue;
 tree(x,z,r(.55,.95));
}
// Surrounding mountain silhouettes and drifting cloud banks.
for(let i=0;i<44;i++){
 const a=i/44*TAU,rr=r(1420,1870),x=Math.cos(a)*rr,z=Math.sin(a)*rr+C;
 const radius=r(100,260),height=r(90,240);
 add(pick(['stone2','foliage1','stone3']),x,36,z,radius,height,radius,r(0,TAU),0,'cone');
}
const clouds=[];
for(let i=0;i<21;i++){
 let a=r(0,TAU),rr=r(860,1560),bx=Math.cos(a)*rr,bz=Math.sin(a)*rr+C;
 for(let j=0;j<4;j++){
  const g=new T.Mesh(new T.DodecahedronGeometry(r(18,36),0),mat.cloud);
  g.scale.set(r(1.5,3),r(.28,.52),r(.8,1.5));g.position.set(bx+j*21,165+r(-8,8),bz+r(-9,9));city.add(g);clouds.push(g);
 }
}
flush();
document.getElementById('count').textContent=homes+' BUILDINGS · '+instances.toLocaleString()+' INSTANCES';
window.shiganshinaMeta={name:'Shiganshina-inspired monumental district v4',expansionFactor:CITY_SCALE,worldWidth:2*R,worldDepth:FRONT-BACK,buildingCount:homes,instances,batches,scale:'1unit = approximately 1 meter',colliders,wallSystems:wallSystems.length,wallSegments,landmarkLots};
// CAMERA & CONTROLS
let mode='orbit', night=false,eco=false,last=performance.now(),frames=0,fps=60,orbitYaw=.68,orbitPitch=.47,orbitRange=720;
const target=new T.Vector3(0,20,-30*CITY_SCALE), pos=new T.Vector3(),aim=new T.Vector3(),viewDir=new T.Vector3();
const state={yaw:Math.PI,pitch:-.09,keys:{},drag:false,dragId:null,lastX:0,lastY:0,joyX:0,joyY:0,vertical:0,smooth:null};
const yawFor=(from,to)=>Math.atan2(-(to.x-from.x),-(to.z-from.z));
function setPose(p,t){camera.position.copy(p);const d=new T.Vector3().subVectors(t,p).normalize();state.yaw=Math.atan2(-d.x,-d.z);state.pitch=Math.asin(clamp(d.y,-.99,.99));camera.rotation.set(state.pitch,state.yaw,0,'YXZ')}
function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));document.body.classList.toggle('moving',mode!=='orbit');
 state.smooth=null;
 if(m==='orbit'){let v=camera.position.clone().sub(target);orbitRange=clamp(v.length(),80,1850);orbitYaw=Math.atan2(v.x,v.z);orbitPitch=clamp(Math.atan2(v.y,Math.hypot(v.x,v.z)),.12,1.35);}
 if(m==='walk'){setPose(new T.Vector3(0,3.35,87*CITY_SCALE),new T.Vector3(0,6,-70*CITY_SCALE));}
 if(m==='fly'){setPose(new T.Vector3(73*CITY_SCALE,56,111*CITY_SCALE),new T.Vector3(0,3,-50*CITY_SCALE));}
 document.getElementById('keys').textContent=m==='orbit'?'ドラッグ：回転　ホイール：拡大縮小':m==='walk'?'WASD：移動　ドラッグ：視点　Shift：走る':'WASD：飛行　Space / C：上下　Shift：加速';
 document.getElementById('help').textContent=m==='orbit'?'巨大城壁、兵団施設、教会、倉庫街まで含めて探索。':m==='walk'?'石畳を歩きながら、建物のスケールと街並みを体感。':'街と壁を自由に飛び回れる。屋根の上も見渡そう。';
}
function orbitCamera(){let hor=Math.cos(orbitPitch)*orbitRange;camera.position.set(target.x+Math.sin(orbitYaw)*hor,target.y+Math.sin(orbitPitch)*orbitRange,target.z+Math.cos(orbitYaw)*hor);camera.lookAt(target)}
orbitCamera();
const jumpDest={gate:{title:'南門・城壁',pos:[96,148,FRONT+122],look:[0,44,FRONT-18]},square:{title:'中央広場',pos:[105*CITY_SCALE,102,40*CITY_SCALE],look:[-2,3,-45*CITY_SCALE]},wall:{title:'マリアの城壁',pos:[R-110,150,C+220],look:[R-18,53,C+165]},roof:{title:'旧市街の赤屋根',pos:[-116*CITY_SCALE,76,54*CITY_SCALE],look:[-34*CITY_SCALE,7,-43*CITY_SCALE]},barracks:{title:'兵団兵舎',pos:[landmarkLots[0].x-5,89,landmarkLots[0].z-168],look:[landmarkLots[0].x,13,landmarkLots[0].z+15]},command:{title:'司令棟',pos:[landmarkLots[1].x+70,125,landmarkLots[1].z-155],look:[landmarkLots[1].x,43,landmarkLots[1].z+7]},warehouse:{title:'倉庫街',pos:[425,83,-231],look:[370,9,-318]}};
function jump(k){const s=jumpDest[k];if(!s)return;
 document.getElementById('destination').textContent=s.title;
 if(mode==='orbit')setMode('fly');
 state.smooth={from:camera.position.clone(),to:new T.Vector3(...s.pos),start:performance.now(),duration:1300,look:new T.Vector3(...s.look)};
}
for(const b of document.querySelectorAll('[data-spot]'))b.addEventListener('click',()=>jump(b.dataset.spot));
for(const b of document.querySelectorAll('[data-mode]'))b.addEventListener('click',()=>setMode(b.dataset.mode));
// Day-to-evening toggle with sky, haze and sun hue changes.
const day={bg:new T.Color(0xa7c7d5),fog:new T.Color(0xa7c7d5),sun:new T.Color(0xffe6b2)},evening={bg:new T.Color(0xc68e78),fog:new T.Color(0xc68e78),sun:new T.Color(0xffa46c)};
let lightMix=0;
document.getElementById('time').addEventListener('click',()=>{night=!night;document.getElementById('time').textContent=night?'昼景にする':'夕景にする';});
document.getElementById('quality').addEventListener('click',()=>{eco=!eco;renderer.setPixelRatio(Math.min(devicePixelRatio||1,eco?.8:(innerWidth<800?1.15:1.6)));renderer.setSize(innerWidth,innerHeight);scene.fog.density=eco?.0010:.00070;document.getElementById('quality').textContent=eco?'通常画質':'軽量化';});
const isTouch='ontouchstart' in window||navigator.maxTouchPoints>0;
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&e.clientX<145&&e.clientY>innerHeight-165&&mode!=='orbit')return;state.drag=true;state.dragId=e.pointerId;state.lastX=e.clientX;state.lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!state.drag||state.dragId!==e.pointerId)return;
 const dx=e.clientX-state.lastX,dy=e.clientY-state.lastY;state.lastX=e.clientX;state.lastY=e.clientY;
 if(mode==='orbit'){orbitYaw-=dx*.004;orbitPitch=clamp(orbitPitch+dy*.004,.08,1.46);}else{state.yaw-=dx*.0037;state.pitch=clamp(state.pitch-dy*.0032,-1.48,1.48);}
});
for(const evt of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(evt,e=>{if(e.pointerId===state.dragId){state.drag=false;state.dragId=null}});
canvas.addEventListener('wheel',e=>{e.preventDefault();if(mode==='orbit')orbitRange=clamp(orbitRange*Math.exp(e.deltaY*.0009),38,1900);else {const forward=new T.Vector3(-Math.sin(state.yaw)*Math.cos(state.pitch),Math.sin(state.pitch),-Math.cos(state.yaw)*Math.cos(state.pitch));camera.position.addScaledVector(forward,clamp(e.deltaY,-200,200)*-.04);}}, {passive:false});
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();state.keys[e.code]=true;if(e.code==='Digit1')setMode('orbit');if(e.code==='Digit2')setMode('walk');if(e.code==='Digit3')setMode('fly')});window.addEventListener('keyup',e=>state.keys[e.code]=false);window.addEventListener('blur',()=>{state.keys={};state.joyX=0;state.joyY=0;state.vertical=0;});
const joystick=document.getElementById('joystick'),stick=document.getElementById('stick');let joystickPointer=null;
function joy(e){const b=joystick.getBoundingClientRect(),x=e.clientX-(b.left+b.width/2),y=e.clientY-(b.top+b.height/2),l=Math.max(1,Math.hypot(x,y)),max=34,mag=Math.min(1,l/max);state.joyX=x/l*mag;state.joyY=y/l*mag;stick.style.transform=`translate(${state.joyX*34}px,${state.joyY*34}px)`;}
joystick.addEventListener('pointerdown',e=>{e.preventDefault();joystickPointer=e.pointerId;joystick.setPointerCapture(e.pointerId);joy(e)});joystick.addEventListener('pointermove',e=>{if(e.pointerId===joystickPointer){e.preventDefault();joy(e)}});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])joystick.addEventListener(ev,e=>{if(e.pointerId===joystickPointer){joystickPointer=null;state.joyX=state.joyY=0;stick.style.transform=''}});
for(const [id,dir] of [['up',1],['down',-1]]){const bt=document.getElementById(id);bt.addEventListener('pointerdown',e=>{e.preventDefault();state.vertical=dir;bt.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])bt.addEventListener(ev,()=>state.vertical=0)}
// Small stylized 2D city map.
const minimap=document.getElementById('mini'),mc=minimap.getContext('2d');
function drawMap(){if(innerWidth<800)return;
 const w=308,sc=.68/CITY_SCALE;mc.clearRect(0,0,w,w);mc.save();mc.translate(w/2,w/2+15);mc.scale(sc,-sc);
 mc.strokeStyle='#f0dfb9ad';mc.lineWidth=6*CITY_SCALE;
 mc.beginPath();mc.moveTo(-R,BACK);mc.lineTo(-R,C);mc.arc(0,C,R,Math.PI,0,true);mc.lineTo(R,BACK);mc.closePath();mc.stroke();
 mc.strokeStyle='#ddd0b65e';mc.lineWidth=10*CITY_SCALE;mc.beginPath();
 mc.moveTo(0,BACK+15);mc.lineTo(0,FRONT-15);
 for(const z of horizontalStreets){const half=z>C?Math.sqrt(Math.max(0,(R-21)**2-(z-C)**2)):R-21;
  mc.moveTo(-half,z);mc.lineTo(half,z);
 }
 for(const x of verticalStreets){if(x===0)continue;
  const top=C+Math.sqrt(Math.max(0,(R-20)**2-x*x));mc.moveTo(x,BACK+15);mc.lineTo(x,top);
 }
 mc.stroke();
 mc.fillStyle='#d4a78c';mc.beginPath();mc.arc(0,-45*CITY_SCALE,12*CITY_SCALE,0,TAU);mc.fill();
 mc.fillStyle='#f9ecc9';mc.beginPath();mc.arc(camera.position.x,camera.position.z,5*CITY_SCALE,0,TAU);mc.fill();
 mc.strokeStyle='#fbe1ab';mc.lineWidth=2*CITY_SCALE;mc.beginPath();mc.moveTo(camera.position.x,camera.position.z);
 mc.lineTo(camera.position.x-12*CITY_SCALE*Math.sin(state.yaw),camera.position.z-12*CITY_SCALE*Math.cos(state.yaw));mc.stroke();mc.restore();
}
function canMove(x,z){if(!insideTown(x,z,10))return false;
 return !colliders.some(c=>Math.abs(c.x-x)<c.w/2+1.15&&Math.abs(c.z-z)<c.d/2+1.15);
}
function move(dt){if(mode==='orbit'){orbitCamera();return;}
 if(state.smooth){const s=state.smooth,t=clamp((performance.now()-s.start)/s.duration,0,1),e=t*t*(3-2*t);camera.position.copy(s.from).lerp(s.to,e);setPose(camera.position,s.look);if(t>=1)state.smooth=null;return;}
 let f= (state.keys.KeyW||state.keys.ArrowUp?1:0)-(state.keys.KeyS||state.keys.ArrowDown?1:0)-state.joyY;
 let side=(state.keys.KeyD||state.keys.ArrowRight?1:0)-(state.keys.KeyA||state.keys.ArrowLeft?1:0)+state.joyX;
 const l=Math.hypot(f,side);if(l>1){f/=l;side/=l}
 const speed=(mode==='walk'?14.5:54)*(state.keys.ShiftLeft||state.keys.ShiftRight?2.4:1),dy=(state.keys.Space?1:0)-(state.keys.KeyC||state.keys.ControlLeft?1:0)+state.vertical;
 let vx=(-Math.sin(state.yaw)*f+Math.cos(state.yaw)*side)*speed*dt;
 let vz=(-Math.cos(state.yaw)*f-Math.sin(state.yaw)*side)*speed*dt;
 if(mode==='walk'){
   let x=camera.position.x+vx,z=camera.position.z+vz;
   if(canMove(x,camera.position.z))camera.position.x=x;
   if(canMove(camera.position.x,z))camera.position.z=z;
   camera.position.y=3.35;
 }else {camera.position.x+=vx;camera.position.z+=vz;camera.position.y=clamp(camera.position.y+dy*speed*dt,2.3,340);}
 camera.rotation.set(state.pitch,state.yaw,0,'YXZ');
}
function loop(now){const dt=Math.min(.05,(now-last)/1000||.016);last=now;
 if(lightMix!==(night?1:0)){lightMix=clamp(lightMix+(night?1:-1)*dt*.55,0,1);scene.background.copy(day.bg).lerp(evening.bg,lightMix);scene.fog.color.copy(day.fog).lerp(evening.fog,lightMix);sun.color.copy(day.sun).lerp(evening.sun,lightMix);sun.position.set(-200+lightMix*380,310-lightMix*170,130);renderer.toneMappingExposure=1.29-lightMix*.16;}
 move(dt);if(mode==='orbit'){// In overview keep the heading marker approximately toward the city.
   const d=target.clone().sub(camera.position);state.yaw=Math.atan2(-d.x,-d.z);
 }
 renderer.render(scene,camera);frames++;if(frames%9===0)drawMap();requestAnimationFrame(loop);
}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,eco?.8:innerWidth<800?1.15:1.6))});
window.addEventListener('contextmenu',e=>e.preventDefault());
requestAnimationFrame(loop);setTimeout(()=>{let l=document.getElementById('loading');l.style.opacity='0';setTimeout(()=>l.remove(),700)},300);
}catch(e){console.error(e);let el=document.getElementById('err');el.style.display='block';el.textContent='街の生成でエラーが発生しました: '+e.message;document.getElementById('loading').style.display='none';}
}
