<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Browser-process-only mitigation for old Skia system-font WOFF/WOFF2 loading.
     Preserve the normal OS font rules and uncompressed fonts; never edit global rules. -->
<fontconfig>
 <include>/etc/fonts/fonts.conf</include>
 <selectfont><rejectfont><glob>/usr/share/fonts/openai-sans/*.woff</glob><glob>/usr/share/fonts/openai-sans/*.woff2</glob></rejectfont></selectfont>
 <cachedir>/tmp/overdrive-qa-font-cache</cachedir>
</fontconfig>
