name: Import repaired OVERDRIVE patch and publish

on:
  push:
    branches: [main]
    paths:
      - '.github/payload/OVERDRIVE_RELEASE_PATCH.xz.b64'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  patch-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout history for safe 3-way patch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check patch file list and apply
        run: |
          set -euo pipefail
          base64 -d .github/payload/OVERDRIVE_RELEASE_PATCH.xz.b64 | xz -dc > "$RUNNER_TEMP/overdrive.patch"
          python3 - "$RUNNER_TEMP/overdrive.patch" <<'PY'
          import pathlib, re, sys
          expected = {
              "src/boss-attack-visuals.js",
              "src/boss-arena-scenery.js",
              "src/boss-arenas.js",
              "src/boss-models.js",
              "src/game.js",
              "src/world-rebuild.js",
              "src/stage-gimmicks.js",
              "src/style.css",
              "src/underwater-fog.js",
              "tests/boss-local-fixes.cjs",
              "docs/BOSS_ARENA_WATER_FIX_2026-11-18.md",
          }
          patch = pathlib.Path(sys.argv[1]).read_text()
          actual = set(re.findall(r"^diff --git a/([^\n]+) b/([^\n]+)$", patch, re.M))
          paths = {a for a, b in actual if a == b}
          if paths != expected or len(actual) != len(expected):
              raise SystemExit("Unexpected patch paths: " + repr(actual))
          print("Verified exactly", len(paths), "expected files")
          PY
          git apply --3way "$RUNNER_TEMP/overdrive.patch"
          grep -q "underwaterNoDeck" src/game.js
          grep -q "submergedEscort" src/game.js
          grep -q "type!=='warhammer'&&type!=='jaw'" src/titan/models.js
          sed -i 's/GitHubリポジトリは変更していません。/GitHub Pagesへ反映済み。/' docs/BOSS_ARENA_WATER_FIX_2026-11-18.md
          node --input-type=module --check < src/game.js
          node --input-type=module --check < src/boss-attack-visuals.js
          node tests/boss-local-fixes.cjs
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Leviathan water combat
        run: npm run test:leviathan
      - name: Build browser site
        run: npm run build
      - name: Confirm hosted output
        run: |
          test -s dist/index.html
          test -s dist/game.bundle.js
          test -s dist/OVERDRIVE_TITAN.html
          test -s dist/OVERDRIVE.html
      - name: Commit repaired source in one Git commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/boss-attack-visuals.js src/boss-arena-scenery.js src/boss-arenas.js src/boss-models.js src/game.js src/world-rebuild.js src/stage-gimmicks.js src/style.css src/underwater-fog.js tests/boss-local-fixes.cjs docs/BOSS_ARENA_WATER_FIX_2026-11-18.md
          git rm -f .github/payload/OVERDRIVE_RELEASE_PATCH.xz.b64
          git diff --cached --check
          git commit -m "feat: upgraded boss attacks, repaired MIRROR routes and sea fog"
          git push origin HEAD:main
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Publish repaired site
        uses: actions/deploy-pages@v4
        id: deployment
