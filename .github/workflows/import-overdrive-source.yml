name: Import OVERDRIVE source ZIP

on:
  push:
    paths:
      - 'OVERDRIVE_SWIM_FIXED_ALL_SOURCE.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract source and remove archive
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import stat

          archive = Path("OVERDRIVE_SWIM_FIXED_ALL_SOURCE.zip")
          if not archive.is_file():
              raise SystemExit("ZIP not found in repository root")
          count = 0
          with ZipFile(archive) as z:
              for entry in z.infolist():
                  p = PurePosixPath(entry.filename)
                  if not p.parts or p.parts[0] != "OVERDRIVE_SOURCE":
                      raise SystemExit(f"Unexpected ZIP entry: {entry.filename}")
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"Unsafe ZIP entry: {entry.filename}")
                  if entry.is_dir() or len(p.parts) < 2:
                      continue
                  mode = entry.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlink not allowed: {entry.filename}")
                  destination = Path(*p.parts[1:])
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(z.read(entry))
                  count += 1
          if count < 50:
              raise SystemExit(f"Unexpectedly small source archive: {count} files")
          archive.unlink()
          print(f"Imported {count} source files")
          PY
      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "import: OVERDRIVE source with Leviathan swimming fix"
          git push
